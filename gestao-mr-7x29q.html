<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão Manto Resenha</title><link rel="stylesheet" href="style.css"><style>body{background:#062419}.admin{max-width:980px;margin:35px auto;background:#f7f4ec;padding:28px;border-radius:12px}.admin input,.admin select{width:100%;padding:12px;margin:6px 0 14px}.admin button{padding:12px 18px;background:#062419;color:#fff;border:0;border-radius:5px}.row{background:white;padding:12px;margin:8px 0;display:grid;grid-template-columns:1fr auto;gap:10px}.row small{display:block;color:#777}.sizesA label{margin-right:10px}.sizesA input{width:auto}.hidden{display:none}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button.active{background:#d6a846;color:#062419}.adminLogo{width:140px;height:95px;object-fit:contain}.lead{background:#fff;padding:16px;margin:10px 0;border-radius:8px}.lead p{margin:5px 0}.muted{color:#777;font-size:12px}</style></head><body><div class="admin"><img class="adminLogo" src="logo.png"><div id="login"><h1>Área de administração</h1><p>Acesso restrito ao administrador.</p><input id="email" type="email" placeholder="E-mail"><input id="pass" type="password" placeholder="Senha"><button id="enter">Entrar</button><p id="err"></p></div><div id="panel" class="hidden"><button id="logout" style="float:right">Sair</button><h1>Administração</h1><div class="tabs"><button class="tab active" data-tab="orders">Interesses</button><button class="tab" data-tab="customers">Cadastros</button><button class="tab" data-tab="catalog">Catálogo</button></div><section id="ordersTab"><h3>Interesses enviados pelo WhatsApp</h3><div id="orders"></div></section><section id="customersTab" class="hidden"><h3>Clientes cadastrados</h3><div id="customers"></div></section><section id="catalogTab" class="hidden"><h3>Adicionar nova camisa</h3><input id="name" placeholder="Nome da camisa"><select id="type"><option>Torcedor</option><option>Jogador</option></select><input id="img" placeholder="URL da foto"><div class="sizesA">Tamanhos: <label><input type="checkbox" value="P">P</label><label><input type="checkbox" value="M">M</label><label><input type="checkbox" value="G">G</label><label><input type="checkbox" value="GG">GG</label></div><button id="add">Adicionar</button><hr><h3>Camisas atuais</h3><input id="find" placeholder="Pesquisar camisa"><div id="list"></div></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
